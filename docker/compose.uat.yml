name: nextjs

services:
  web:
    build:
      context: ..
      dockerfile: app/Dockerfile
      target: uat
    restart: unless-stopped
    ports:
      - 3000:3000
    env_file:
      - ../app/.env.uat
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
