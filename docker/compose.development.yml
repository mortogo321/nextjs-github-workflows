name: nextjs

services:
  web:
    build:
      context: ..
      dockerfile: app/Dockerfile
      target: development
    restart: unless-stopped
    ports:
      - 8000:3000
    env_file:
      - ../app/.env.development
    volumes:
      - ../app/src:/app/src
      - ../app/public:/app/public
    healthcheck:
      test: ["CMD", "bun", "--version"]
      interval: 30s
      timeout: 5s
      retries: 3
